<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso Negado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff3f3;
            padding: 40px;
        }
        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.12);
            text-align: center;
        }
        h2 {
            color: #c62828;
        }
        a {
            text-decoration: none;
            color: white;
            background: #1f3c88;
            padding: 10px 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Acesso Negado</h2>
        <p>Você não tem permissão para acessar esta área.</p>
        <a href="/dashboard">Voltar</a>
    </div>
</body>
</html>
